[server]
maxUploadSize = 4024
enableCORS = false
enableXsrfProtection = false
address = "0.0.0.0"
port = 8501
# Performance: Disable file watcher to reduce CPU usage
fileWatcherType = "none"
# Reduce memory usage by limiting concurrent sessions
maxMessageSize = 200

[theme]
base = "dark"
primaryColor = "#6366f1"
secondaryBackgroundColor = "#1e293b"
backgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans-serif"

[browser]
gatherUsageStats = false

[runner]
# Prevent automatic reruns on script changes
fastReruns = true
# Reduce memory usage
magicEnabled = false

[client]
# Improve connection stability
toolbarMode = "minimal"
showErrorDetails = true
